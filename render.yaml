services:
  - type: web
    name: city-gate-capital
    branch: main
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run preview-claims && npm run verify:render && npm run build && npm run production-guard
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    disk:
      name: city-gate-capital-data
      mountPath: /private
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PLATFORM_MODE
        value: preview
      - key: VITE_PLATFORM_MODE
        value: preview
      - key: PUBLIC_SITE_PUBLISHED
        value: "1"
      - key: VITE_PUBLIC_SITE_PUBLISHED
        value: "1"
      - key: ENABLE_FINANCIAL_OPERATIONS
        value: "0"
      - key: ENABLE_PAPER_TRADING
        value: "0"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "1"
      - key: VITE_ALLOW_PUBLIC_REGISTRATION
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: PRIVATE_DATA_ROOT
        value: /private
      - key: ENABLE_LOCAL_OPERATIONAL_BACKUPS
        value: "1"
      - key: BACKUP_DIRECTORY
        value: /private/backups
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: MEDIA_ASSET_ROOT
        value: /private/public-assets
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: cgc-media
      - key: SESSION_SECRET
        sync: false
      - key: CARD_ENCRYPTION_KEY
        sync: false
