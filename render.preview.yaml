databases:
  - name: city-gate-capital-preview-db-2026
    plan: free
    region: virginia
    databaseName: city_gate_capital_preview
    user: city_gate_preview
    postgresMajorVersion: "18"

services:
  - type: web
    name: city-gate-capital-preview-2026
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate && npm run preview:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PLATFORM_MODE
        value: preview
      - key: VITE_PLATFORM_MODE
        value: preview
      - key: ENABLE_FINANCIAL_OPERATIONS
        value: "0"
      - key: ENABLE_PAPER_TRADING
        value: "0"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "0"
      - key: VITE_ALLOW_PUBLIC_REGISTRATION
        value: "0"
      - key: ENABLE_PREVIEW_USER_SEED
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: SESSION_TIMEOUT_MINUTES
        value: "60"
      - key: PRIVATE_DATA_ROOT
        value: /tmp/city-gate-capital
      - key: MEDIA_ASSET_ROOT
        value: /tmp/city-gate-capital/public-assets
      - key: APP_URL
        value: https://city-gate-capital-preview-2026.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: city-gate-capital-preview-db-2026
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CARD_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PREVIEW_USER_EMAIL
        sync: false
      - key: PREVIEW_USER_PASSWORD
        sync: false
      - key: PREVIEW_USER_NAME
        value: City Gate Preview
