  /api/admin/email/log:
    get:
      summary: Email delivery log
      tags: [Admin Email]
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Email log

  /api/admin/newsletter/campaigns:
    get:
