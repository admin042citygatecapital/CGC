        - adminAuth: []
      responses:
        '200':
          description: CMS content
    post:
      summary: Update CMS content
      tags: [Admin CMS]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                section:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: CMS updated

  /api/admin/smtp/status:
    get:
