        '200':
          description: Campaigns list
    post:
      summary: Create newsletter campaign
      tags: [Admin Newsletter]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, subject, body]
              properties:
                name:
                  type: string
                subject:
                  type: string
                body:
                  type: string
      responses:
        '201':
          description: Campaign created

