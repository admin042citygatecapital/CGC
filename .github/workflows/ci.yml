name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_DATA_ROOT: /tmp/cgc-private-${{ github.run_id }}
      MEDIA_ASSET_ROOT: /tmp/cgc-private-${{ github.run_id }}/public-assets
      BACKUP_DIRECTORY: /tmp/cgc-private-${{ github.run_id }}/backups

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Scan public claims and secret-like content
        run: npm run preview-claims

      - name: Type check, lint, test and build
        run: npm run verify

      - name: Enforce production financial lock
        env:
          NODE_ENV: production
          PLATFORM_MODE: preview
          VITE_PLATFORM_MODE: preview
          ENABLE_FINANCIAL_OPERATIONS: "0"
          ENABLE_PAPER_TRADING: "0"
          PUBLIC_SITE_PUBLISHED: "1"
          VITE_PUBLIC_SITE_PUBLISHED: "1"
        run: npm run production-guard
