<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – City Gate Capital</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #ccc; font-family: 'Georgia', serif; min-height: 100vh; }
    header {
      background: #111; border-bottom: 1px solid #b8952a;
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { color: #b8952a; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    .brand span { color: #666; font-size: 11px; display: block; letter-spacing: 3px; margin-top: 2px; }
    .logout-btn {
      padding: 8px 20px; background: transparent; border: 1px solid #b8952a;
      color: #b8952a; border-radius: 4px; font-size: 12px; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { background: #b8952a; color: #0a0a0a; }
    main { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .page-title { color: #fff; font-size: 20px; letter-spacing: 1px; margin-bottom: 8px; }
    .page-subtitle { color: #555; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .stat-card {
      background: #111; border: 1px solid #222; border-top: 3px solid #b8952a;
      border-radius: 6px; padding: 24px; text-align: center;
    }
    .stat-label { color: #666; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    .stat-value { color: #b8952a; font-size: 36px; font-weight: bold; }
    .section { margin-bottom: 40px; }
    .section-title {
      color: #b8952a; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #222;
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      background: #161616; color: #666; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; padding: 12px 16px; text-align: left; border-bottom: 1px solid #222;
    }
    .data-table td { padding: 12px 16px; border-bottom: 1px solid #1a1a1a; color: #bbb; }
    .data-table tr:hover td { background: #141414; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-admin   { background: #2a1f00; color: #b8952a; border: 1px solid #b8952a; }
    .badge-user    { background: #0a1520; color: #4a9eff; border: 1px solid #2a5a9a; }
    .badge-active  { background: #0a200a; color: #4aff6b; border: 1px solid #2a6b2a; }
    .badge-pending { background: #201500; color: #ffaa4a; border: 1px solid #6b4a00; }
    .empty-state { color: #444; font-size: 13px; padding: 24px 0; text-align: center; }
    #authGuard {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #0a0a0a; color: #b8952a; font-size: 16px; letter-spacing: 2px;
    }
    #dashboardContent { display: none; }
  </style>
</head>
<body>
<div id="authGuard">Verifying access…</div>
<div id="dashboardContent">
  <header>
    <div class="brand">City Gate Capital <span>Admin Dashboard</span></div>
    <button class="logout-btn" id="logoutBtn">Sign Out</button>
  </header>
  <main>
    <h1 class="page-title">Dashboard Overview</h1>
    <p class="page-subtitle" id="adminEmail">Loading…</p>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Users</div>
        <div class="stat-value" id="statUsers">…</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Accounts</div>
        <div class="stat-value" id="statAccounts">…</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Transactions</div>
        <div class="stat-value" id="statTransactions">…</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Recent Users (Last 10)</div>
      <table class="data-table">
        <thead><tr><th>Full Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th></tr></thead>
        <tbody id="usersTableBody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="section">
      <div class="section-title">Recent Transactions (Last 10)</div>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th><th>Account ID</th></tr></thead>
        <tbody id="transactionsTableBody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script>
  const SUPABASE_URL  = 'https://chdpquotirulzmycpcxm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoZHBxdW90aXJ1bHpteWNwY3htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDQ3MTIsImV4cCI6MjA5NTIyMDcxMn0._IhimnZXQbmqr84t_Szv17hYYinaib70Ou2T-SXWnAE';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = '/admin-login.html'; return; }
    const { data: profile } = await sb.from('profiles').select('role, full_name, email').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { await sb.auth.signOut(); window.location.href = '/admin-login.html'; return; }
    document.getElementById('authGuard').style.display = 'none';
    document.getElementById('dashboardContent').style.display = 'block';
    document.getElementById('adminEmail').textContent = 'Signed in as ' + (profile.email || session.user.email);
    loadStats(); loadRecentUsers(); loadRecentTransactions();
  }

  async function loadStats() {
    const [usersRes, accountsRes, txRes] = await Promise.all([
      sb.from('profiles').select('id', { count: 'exact', head: true }),
      sb.from('accounts').select('id', { count: 'exact', head: true }),
      sb.from('transactions').select('id', { count: 'exact', head: true })
    ]);
    document.getElementById('statUsers').textContent        = usersRes.count   ?? '—';
    document.getElementById('statAccounts').textContent     = accountsRes.count ?? '—';
    document.getElementById('statTransactions').textContent = txRes.count       ?? '—';
  }

  async function loadRecentUsers() {
    const { data, error } = await sb.from('profiles').select('full_name, email, role, status, created_at').order('created_at', { ascending: false }).limit(10);
    const tbody = document.getElementById('usersTableBody');
    if (error || !data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No users found.</td></tr>'; return; }
    tbody.innerHTML = data.map(u => `<tr>
      <td>${u.full_name || '—'}</td>
      <td>${u.email || '—'}</td>
      <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role || 'user'}</span></td>
      <td><span class="badge ${u.status === 'active' ? 'badge-active' : 'badge-pending'}">${u.status || 'pending'}</span></td>
      <td>${u.created_at ? new Date(u.created_at).toLocaleDateString('en-GB') : '—'}</td>
    </tr>`).join('');
  }

  async function loadRecentTransactions() {
    const { data, error } = await sb.from('transactions').select('created_at, type, amount, status, account_id').order('created_at', { ascending: false }).limit(10);
    const tbody = document.getElementById('transactionsTableBody');
    if (error || !data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No transactions found.</td></tr>'; return; }
    tbody.innerHTML = data.map(t => `<tr>
      <td>${t.created_at ? new Date(t.created_at).toLocaleDateString('en-GB') : '—'}</td>
      <td>${t.type || '—'}</td>
      <td>${t.amount != null ? '£' + Number(t.amount).toLocaleString('en-GB', {minimumFractionDigits:2}) : '—'}</td>
      <td><span class="badge ${t.status === 'completed' ? 'badge-active' : 'badge-pending'}">${t.status || '—'}</span></td>
      <td style="font-size:11px;color:#555;">${t.account_id || '—'}</td>
    </tr>`).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = '/admin-login.html';
    });
  });

  init();
</script>
</body>
</html>
